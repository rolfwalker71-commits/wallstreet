# Produktion / Homelab: nur GHCR-Images, kein lokales Dockerfile.
# Remote: docker compose pull && docker compose up -d
# Lokal bauen: docker compose -f docker-compose.yml -f docker-compose.build.yml build

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:-rolf}/wallstreet-frontend:${TAG:-latest}
    ports:
      - "${APP_PORT:-4499}:4499"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-rolf}/wallstreet-backend:${TAG:-latest}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wallstreet}:${POSTGRES_PASSWORD:-wallstreet}@db:5432/${POSTGRES_DB:-wallstreet}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${APP_PORT:-4499},http://127.0.0.1:${APP_PORT:-4499}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallstreet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallstreet}
      POSTGRES_DB: ${POSTGRES_DB:-wallstreet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallstreet} -d ${POSTGRES_DB:-wallstreet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: